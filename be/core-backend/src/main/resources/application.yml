spring:
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  output:
    ansi:
      enabled: ALWAYS
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

logging:
  level:
    org.springframework.security: DEBUG
    org.jooq: DEBUG
    vn.backend: DEBUG

minio:
  endpoint: http://localhost:9000
  bucket: ${MINIO_BUCKET:crm}
  access-key: ${MINIO_ROOT_USER:minioadmin}
  secret-key: ${MINIO_ROOT_PASSWORD:minioadmin}

app:
  name: Base Backend
  version: 1.0.0
system:
  enabled-register: true
  domain: http://localhost:9000

jwt:
  expiration-access-token: ${EXPIRATION_AT:300000}
  expiration-refresh-token: ${EXPIRATION_RT:5184000} #60 days = 60 * 24 * 60 * 60
  secret-key-access-token: ${SECRET_KET_AT:TuAnD3pZa1Jyl3use1/ChT3uaD1PZa4V0ick+T84IABvc}
  secret-key-refresh-token: ${SECRET_KEY_RT:Ty@nDzaiHc23grw3@/Tr0NgVt23Ym+145hjgRtBn9fv6y}

# VietQR Payment Configuration
vietqr:
  api-url: ${VIETQR_API_URL:https://api.vietqr.io}
  client-id: ${VIETQR_CLIENT_ID:}
  api-key: ${VIETQR_API_KEY:}

# PayPal Payment Configuration (for VNPay method)
paypal:
  base-url: ${PAYPAL_BASE_URL:https://api-m.sandbox.paypal.com}
  client-id: ${PAYPAL_CLIENT_ID:}
  client-secret: ${PAYPAL_CLIENT_SECRET:}
